{% extends "events/manage/base.html" %}
{% block title %}Edit field · {{ event.title }} · {{ site_title }}{% endblock %}
{% block content %}
<h1>Edit field</h1>
<form method="post">
  {% csrf_token %}
  {% include "events/manage/partials/form_fields.html" %}
  <div class="form-actions">
    <button type="submit">Save field</button>
    <a href="{% url 'manage_event_settings' event.slug %}">Cancel</a>
  </div>
</form>
{% endblock %}
