{% extends "events/manage/base.html" %}
{% block title %}Edit {{ attendee.name }} · {{ event.title }} · {{ site_title }}{% endblock %}
{% block content %}
<h1>Edit {{ attendee.name }}</h1>
<form method="post">
  {% csrf_token %}
  {% include "events/manage/partials/form_fields.html" %}
  <div class="form-actions">
    <button type="submit">Save details</button>
    <a href="{% url 'manage_event_responses' event.slug %}">Cancel</a>
  </div>
</form>
{% endblock %}
